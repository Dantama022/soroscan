apiVersion: apps/v1
kind: Deployment
metadata:
  name: soroscan-worker-high
  namespace: soroscan
  labels:
    app: soroscan
    component: worker-high
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soroscan
      component: worker-high
  template:
    metadata:
      labels:
        app: soroscan
        component: worker-high
        metrics: "true"
    spec:
      containers:
        - name: worker
          image: soroscan/backend:v1.0.0
          command: ["sh", "-c"]
          args:
            - mkdir -p /tmp/prometheus-multiproc && rm -f /tmp/prometheus-multiproc/* && exec celery -A soroscan worker --loglevel=info --concurrency=8 --queues=high_priority --max-tasks-per-child=1000 --stop-timeout=30
          workingDir: /app
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          env:
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus-multiproc
            - name: PROMETHEUS_METRICS_PORT
              value: "9100"
          envFrom:
            - configMapRef:
                name: soroscan-config
            - secretRef:
                name: soroscan-secrets
          resources:
            limits:
              cpu: 2000m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 1000
---
