# Versioned SDK releases (tag-driven).
#
# Python SDK (issue #133): bump sdk/python/pyproject.toml version, then tag:
#   git tag sdk-python-v0.2.0 && git push origin sdk-python-v0.2.0
#
# TypeScript SDK (issue #1725): bump sdk/typescript/package.json version, then tag:
#   git tag sdk-typescript-v0.2.0 && git push origin sdk-typescript-v0.2.0
# Requires an NPM_TOKEN repository secret (npm automation token with publish
# rights to the @soroscan scope). Packages are published with npm provenance.
# Pull requests touching the TS SDK run a build + `npm publish --dry-run`.
name: SDK release

on:
  push:
    tags:
      - "sdk-python-v*"
      - "sdk-typescript-v*"
  pull_request:
    branches: [main, dev]
    paths:
      - "sdk/typescript/**"
      - "django-backend/soroscan/ingest/**"
      - ".github/workflows/sdk-release.yml"

permissions:
  contents: read

jobs:
  publish:
    name: Publish Python SDK
    if: startsWith(github.ref, 'refs/tags/sdk-python-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install hatch

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#sdk-python-v}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag sdk-python-v$TAG does not match pyproject.toml version $VER"
            exit 1
          fi

      - name: Verify GraphQL Codegen
        run: |
          cd sdk/typescript && npm ci && npm run generate
          cd ../python && pip install ariadne-codegen && ariadne-codegen
          if [[ -n $(git status --porcelain) ]]; then
            echo "::error::Generated SDK types are out of sync with the schema. Run codegen locally and commit the changes."
            exit 1
          fi

      - name: Run tests
        run: pip install -e ".[dev]" && pytest -q

      - name: Build wheel and sdist
        run: hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
        # Configure trusted publishing in PyPI for this repo, or set:
        #   repository-url: https://test.pypi.org/legacy/  (for testing)

  typescript:
    name: TypeScript SDK ${{ startsWith(github.ref, 'refs/tags/sdk-typescript-v') && 'publish' || 'dry run' }}
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/sdk-typescript-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/sdk-typescript-v')
        working-directory: sdk/typescript
        run: |
          TAG="${GITHUB_REF_NAME#sdk-typescript-v}"
          VER=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag sdk-typescript-v$TAG does not match package.json version $VER"
            exit 1
          fi

      # The SDK's codegen step reads django-backend/schema.graphql, which is
      # exported from the Strawberry schema rather than committed.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: django-backend/requirements.txt

      - name: Export GraphQL schema
        working-directory: django-backend
        env:
          DJANGO_SETTINGS_MODULE: soroscan.settings_test
          SECRET_KEY: sdk-release-schema-export
        run: |
          pip install -r requirements.txt
          python - <<'PY'
          import django
          django.setup()
          from strawberry.printer import print_schema
          from soroscan.ingest.schema import schema
          with open("schema.graphql", "w") as fh:
              fh.write(print_schema(schema) + "\n")
          PY
          test -s schema.graphql

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Build
        working-directory: sdk/typescript
        run: npm run build

      - name: Pack (dry run)
        working-directory: sdk/typescript
        run: npm pack --dry-run

      - name: Publish (dry run)
        if: github.event_name == 'pull_request'
        working-directory: sdk/typescript
        run: npm publish --dry-run --ignore-scripts --access public

      - name: Test
        if: startsWith(github.ref, 'refs/tags/sdk-typescript-v')
        working-directory: sdk/typescript
        run: npm test

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/sdk-typescript-v')
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Build and tests already ran above; skip prepublishOnly re-running them.
        run: npm publish --provenance --access public --ignore-scripts
