# Issue #1723 — Secret scanning with gitleaks.
#
# - Pull requests: scans only the commits introduced by the PR.
# - Pushes to main/dev: scans the pushed commit range.
# - Weekly schedule / manual dispatch: scans the full git history.
#
# False positives are allowlisted in .gitleaks.toml at the repo root. A single
# line can also be silenced with an inline `gitleaks:allow` comment.
#
# The gitleaks CLI is installed directly (checksum-verified) rather than via
# gitleaks-action, which requires a paid license for organisation repos.
name: Secret Scan

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Determine scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          case "$EVENT_NAME" in
            pull_request)
              echo "log_opts=${PR_BASE}..${PR_HEAD}" >> "$GITHUB_OUTPUT" ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] \
                 && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                echo "log_opts=${PUSH_BEFORE}..${PUSH_AFTER}" >> "$GITHUB_OUTPUT"
              else
                echo "log_opts=" >> "$GITHUB_OUTPUT"
              fi ;;
            *)
              # schedule / workflow_dispatch: full history
              echo "log_opts=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run gitleaks
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          set -euo pipefail
          args=(git . --config .gitleaks.toml --redact --verbose --no-banner
                --exit-code 1 --report-format sarif --report-path gitleaks.sarif)
          if [ -n "$LOG_OPTS" ]; then
            echo "Scanning commit range: $LOG_OPTS"
            args+=(--log-opts "$LOG_OPTS")
          else
            echo "Scanning full history"
          fi
          gitleaks "${args[@]}"

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 7
