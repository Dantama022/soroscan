# Issue #1285 — SDK Integration Test Suite
#
# Runs the Python and TypeScript SDK integration tests against a live backend
# that is spun up by this workflow.
#
# Triggers
# --------
# - Every push/PR to main or dev (full matrix)
# - Manual dispatch with configurable parameters
#
# Skip logic
# ----------
# Individual SDK tests are guarded by their own skip conditions
# (SOROSCAN_INTEGRATION_TEST_URL unset → all tests skip).  The workflow
# sets this variable, so tests run in CI but remain skippable locally.
#
# Matrix strategy
# ---------------
# Both SDKs share the same live backend.  They run in parallel to shorten
# total CI wall-clock time.

name: SDK Integration Tests

on:
  push:
    branches: [main, dev]
    paths:
      - "sdk/**"
      - "django-backend/**"
      - ".github/workflows/sdk-integration-tests.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "sdk/**"
      - "django-backend/**"
      - ".github/workflows/sdk-integration-tests.yml"
  workflow_dispatch:
    inputs:
      python_sdk:
        description: "Run Python SDK integration tests"
        type: boolean
        default: true
      typescript_sdk:
        description: "Run TypeScript SDK integration tests"
        type: boolean
        default: true

permissions:
  contents: read

# Cancel in-flight runs for the same branch on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Start the Django backend and wait for it to be healthy
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    name: Launch test backend
    runs-on: ubuntu-latest
    outputs:
      base-url: http://localhost:8000
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroscan_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "django-backend/requirements.txt"

      - name: Install backend dependencies
        working-directory: django-backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply migrations
        working-directory: django-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soroscan_integration
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: integration-test-secret-key
          DEBUG: "True"
          DJANGO_SETTINGS_MODULE: soroscan.settings
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          SOROSCAN_CONTRACT_ID: CCAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          CELERY_TASK_ALWAYS_EAGER: "True"
          SENTRY_DSN: ""
        run: python manage.py migrate --noinput

      - name: Create integration test user & API key
        id: create-api-key
        working-directory: django-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soroscan_integration
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: integration-test-secret-key
          DJANGO_SETTINGS_MODULE: soroscan.settings
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          SOROSCAN_CONTRACT_ID: CCAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          CELERY_TASK_ALWAYS_EAGER: "True"
          SENTRY_DSN: ""
        run: |
          API_KEY=$(python manage.py shell -c "
          from django.contrib.auth import get_user_model
          from rest_framework.authtoken.models import Token
          User = get_user_model()
          u, _ = User.objects.get_or_create(username='sdk-integration-test', is_staff=True, is_superuser=True)
          u.set_password('testpassword123!')
          u.save()
          t, _ = Token.objects.get_or_create(user=u)
          print(t.key)
          ")
          echo "api_key=${API_KEY}" >> "$GITHUB_OUTPUT"
          echo "::add-mask::${API_KEY}"

      - name: Start Django dev server (background)
        working-directory: django-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soroscan_integration
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: integration-test-secret-key
          DEBUG: "True"
          DJANGO_SETTINGS_MODULE: soroscan.settings
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          SOROSCAN_CONTRACT_ID: CCAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          CELERY_TASK_ALWAYS_EAGER: "True"
          SENTRY_DSN: ""
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          echo $! > /tmp/django_pid
          # Wait for the backend to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health/ > /dev/null 2>&1; then
              echo "Backend is up after $i seconds."
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 1
          done
          echo "Backend did not come up in time."
          exit 1

      # The outputs are available to dependent jobs through the GitHub Actions
      # context.  We cannot export step-scoped env vars across jobs directly,
      # so we rely on the well-known localhost port (8000) and pass the API
      # key through job outputs.
      - name: Export API key to job output
        id: export-key
        run: echo "api_key=${{ steps.create-api-key.outputs.api_key }}" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────────
  # Python SDK integration tests
  # ──────────────────────────────────────────────────────────────────────────
  python-sdk-integration:
    name: Python SDK integration
    runs-on: ubuntu-latest
    needs: backend
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.python_sdk }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroscan_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "django-backend/requirements.txt"

      - name: Install backend and start it
        working-directory: django-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soroscan_integration
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: integration-test-secret-key
          DEBUG: "True"
          DJANGO_SETTINGS_MODULE: soroscan.settings
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          SOROSCAN_CONTRACT_ID: CCAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          CELERY_TASK_ALWAYS_EAGER: "True"
          SENTRY_DSN: ""
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python manage.py migrate --noinput
          API_KEY=$(python manage.py shell -c "
          from django.contrib.auth import get_user_model
          from rest_framework.authtoken.models import Token
          User = get_user_model()
          u, _ = User.objects.get_or_create(username='sdk-integration-test', is_staff=True, is_superuser=True)
          u.set_password('testpassword123!')
          u.save()
          t, _ = Token.objects.get_or_create(user=u)
          print(t.key)
          ")
          echo "INTEGRATION_API_KEY=${API_KEY}" >> "$GITHUB_ENV"
          echo "::add-mask::${API_KEY}"
          python manage.py runserver 0.0.0.0:8000 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health/ > /dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: Install Python SDK
        working-directory: sdk/python
        run: pip install -e ".[dev]"

      - name: Run Python SDK integration tests
        working-directory: sdk/python
        env:
          SOROSCAN_INTEGRATION_TEST_URL: http://localhost:8000
          SOROSCAN_INTEGRATION_API_KEY: ${{ env.INTEGRATION_API_KEY }}
        run: |
          pytest tests/test_live_integration.py -v \
            --tb=short \
            --timeout=60 \
            -k "not test_network_error"  # Skip connection error test in CI

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-integration-results
          path: sdk/python/.pytest_cache/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # TypeScript SDK integration tests
  # ──────────────────────────────────────────────────────────────────────────
  typescript-sdk-integration:
    name: TypeScript SDK integration
    runs-on: ubuntu-latest
    needs: backend
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.typescript_sdk }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroscan_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for backend)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "django-backend/requirements.txt"

      - name: Install backend and start it
        working-directory: django-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soroscan_integration
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: integration-test-secret-key
          DEBUG: "True"
          DJANGO_SETTINGS_MODULE: soroscan.settings
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          SOROSCAN_CONTRACT_ID: CCAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          CELERY_TASK_ALWAYS_EAGER: "True"
          SENTRY_DSN: ""
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python manage.py migrate --noinput
          API_KEY=$(python manage.py shell -c "
          from django.contrib.auth import get_user_model
          from rest_framework.authtoken.models import Token
          User = get_user_model()
          u, _ = User.objects.get_or_create(username='sdk-integration-test', is_staff=True, is_superuser=True)
          u.set_password('testpassword123!')
          u.save()
          t, _ = Token.objects.get_or_create(user=u)
          print(t.key)
          ")
          echo "INTEGRATION_API_KEY=${API_KEY}" >> "$GITHUB_ENV"
          echo "::add-mask::${API_KEY}"
          python manage.py runserver 0.0.0.0:8000 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health/ > /dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Run TypeScript SDK integration tests
        working-directory: sdk/typescript
        env:
          SOROSCAN_INTEGRATION_TEST_URL: http://localhost:8000
          SOROSCAN_INTEGRATION_API_KEY: ${{ env.INTEGRATION_API_KEY }}
        run: npx vitest run test/integration.test.ts --reporter=verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-sdk-integration-results
          path: sdk/typescript/test-results/
          retention-days: 7
