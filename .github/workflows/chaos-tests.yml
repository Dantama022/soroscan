# Chaos Tests
#
# Destructive experiments are NEVER run in this workflow. CI only validates
# scenario definitions, command construction, and production safety guards.
# Live execution requires a dedicated chaos-testing namespace and
# SOROSCAN_CHAOS_RUN=1. See docs/testing/chaos-engineering.md.

on:
  push:
    branches: [main, dev]
    paths:
      - "tests/chaos/**"
      - "testing/**"
      - "docker-compose.chaos.yml"
      - ".github/workflows/chaos-tests.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "tests/chaos/**"
      - "testing/**"
      - "docker-compose.chaos.yml"
      - ".github/workflows/chaos-tests.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pytest PyYAML

      - name: Validate shared safety helpers
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q testing/tests

      - name: Validate chaos scenarios
        working-directory: tests/chaos
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Dry-run kubernetes and compose backends
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tests/chaos/run_chaos.py --backend kubernetes
          python tests/chaos/run_chaos.py --backend compose
          test -f tests/chaos/results/chaos-summary.json

      - name: Upload dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-dry-run-report
          path: tests/chaos/results/chaos-summary.json
