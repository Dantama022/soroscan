<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" role="img" aria-labelledby="title desc">
<title id="title">SoroScan 375 pixel responsive navigation wireframe with drawer open</title>
<desc id="desc">Mobile dashboard wireframe showing header, filter controls and event cards with a slide-out navigation drawer overlay.</desc>
<style>
  .bg{fill:#070a0e} .panel{fill:#0b0f14;stroke:#303842} .line{stroke:#303842;stroke-width:1}
  .label{fill:#f2f5f7;font:600 13px ui-monospace,SFMono-Regular,Consolas,monospace}
  .title{fill:#f2f5f7;font:700 18px ui-monospace,SFMono-Regular,Consolas,monospace}
  .muted{fill:#9aa4af;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
  .tiny{fill:#7d8793;font:10px ui-monospace,SFMono-Regular,Consolas,monospace}
  .kicker{fill:#7d8793;font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1px}
  .accent{fill:none;stroke:#c5ff5a;stroke-width:1.5} .active{fill:#151c21;stroke:#c5ff5a}
</style>
<rect width="375" height="812" class="bg"/>
<rect x="0" y="0" width="375" height="60" class="panel"/>
<rect x="16" y="19" width="22" height="18" rx="3" class="accent"/>
<line x1="21" y1="24" x2="33" y2="24" class="accent"/><line x1="21" y1="28" x2="33" y2="28" class="accent"/><line x1="21" y1="32" x2="33" y2="32" class="accent"/>
<text x="52" y="36" class="label">SOROSCAN</text>
<circle cx="344" cy="29" r="10" class="accent"/>

<text x="16" y="92" class="kicker">EVENT EXPLORER</text>
<text x="16" y="119" class="title">Contract events</text>
<text x="16" y="140" class="muted">Live Soroban activity</text>

<rect x="16" y="160" width="343" height="40" rx="6" class="panel"/>
<text x="30" y="185" class="muted">Search contract, tx, topic…</text>

<rect x="16" y="212" width="168" height="40" rx="6" class="panel"/>
<text x="31" y="237" class="label">☷ Filters (3)</text>
<rect x="196" y="212" width="163" height="40" rx="6" class="panel"/>
<text x="212" y="237" class="muted">Newest first ▾</text>

<text x="16" y="280" class="kicker">RESULTS · CARD VIEW</text>
<rect x="16" y="296" width="343" height="150" rx="8" class="panel"/>
<text x="30" y="322" class="label">TRANSFER</text><text x="295" y="322" class="tiny">2s ago</text>
<text x="30" y="348" class="muted">Contract  CBA3…7KQ9</text><text x="30" y="371" class="muted">Ledger    12,456,981</text>
<text x="30" y="394" class="muted">Tx        8f2a…41ce</text>
<rect x="30" y="409" width="72" height="22" rx="11" class="active"/><text x="42" y="424" class="tiny">transfer</text>

<rect x="16" y="458" width="343" height="150" rx="8" class="panel"/>
<text x="30" y="484" class="label">CONTRACT</text><text x="295" y="484" class="tiny">8s ago</text>
<text x="30" y="510" class="muted">Contract  CDB9…2P1A</text><text x="30" y="533" class="muted">Ledger    12,456,980</text>
<text x="30" y="556" class="muted">Tx        a9be…8d10</text>
<rect x="30" y="571" width="68" height="22" rx="11" class="panel"/><text x="42" y="586" class="tiny">system</text>

<rect x="16" y="630" width="343" height="54" rx="8" class="panel"/>
<text x="30" y="663" class="muted">Load more events</text>
<text x="16" y="714" class="tiny">375 px · nav drawer · 1-column cards · filters collapsed</text>

  <rect x="0" y="60" width="375" height="752" fill="#000000" opacity="0.55"/>
  <rect x="0" y="60" width="320" height="752" rx="0" fill="#0b0f14" stroke="#38404a"/>
  <text x="24" y="96" class="kicker">NAVIGATION</text>
  <text x="286" y="96" class="label">×</text>
  <rect x="16" y="116" width="288" height="42" rx="6" class="active"/>
  <text x="32" y="143" class="label">Events</text>
  <text x="32" y="187" class="muted">Performance</text>
  <text x="32" y="225" class="muted">Multi-Region</text>
  <text x="32" y="263" class="muted">Live Stream</text>
  <line x1="16" y1="286" x2="304" y2="286" class="line"/>
  <text x="32" y="321" class="muted">Contracts</text>
  <text x="32" y="359" class="muted">Webhooks</text>
  <text x="32" y="397" class="muted">Organization</text>
  <text x="32" y="435" class="muted">Admin</text>
  <line x1="16" y1="458" x2="304" y2="458" class="line"/>
  <text x="32" y="493" class="muted">Settings</text>
  <text x="24" y="774" class="tiny">Close: × · backdrop · Esc · route select</text>

</svg>