<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="title desc">
<title id="title">SoroScan 768 pixel responsive navigation wireframe</title>
<desc id="desc">Tablet dashboard wireframe showing drawer navigation trigger, compact filter bar and two-column event cards.</desc>
<style>
  .bg{fill:#070a0e} .panel{fill:#0b0f14;stroke:#303842} .line{stroke:#303842;stroke-width:1}
  .label{fill:#f2f5f7;font:600 13px ui-monospace,SFMono-Regular,Consolas,monospace}
  .title{fill:#f2f5f7;font:700 20px ui-monospace,SFMono-Regular,Consolas,monospace}
  .muted{fill:#9aa4af;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
  .tiny{fill:#7d8793;font:10px ui-monospace,SFMono-Regular,Consolas,monospace}
  .kicker{fill:#7d8793;font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1px}
  .accent{fill:none;stroke:#c5ff5a;stroke-width:1.5} .active{fill:#151c21;stroke:#c5ff5a}
</style>
<rect width="768" height="1024" class="bg"/>
<rect x="0" y="0" width="768" height="60" class="panel"/>
<rect x="20" y="19" width="22" height="18" rx="3" class="accent"/>
<line x1="25" y1="24" x2="37" y2="24" class="accent"/><line x1="25" y1="28" x2="37" y2="28" class="accent"/><line x1="25" y1="32" x2="37" y2="32" class="accent"/>
<text x="58" y="36" class="label">SOROSCAN</text>
<text x="608" y="35" class="muted">Testnet</text><circle cx="730" cy="29" r="10" class="accent"/>

<text x="24" y="101" class="kicker">EVENT EXPLORER</text>
<text x="24" y="132" class="title">Contract events</text>
<text x="24" y="154" class="muted">Tablet layout keeps content width by using an overlay app drawer.</text>

<rect x="24" y="178" width="720" height="44" rx="6" class="panel"/>
<text x="40" y="205" class="muted">Search contract, transaction, ledger or topic…</text>

<rect x="24" y="236" width="172" height="40" rx="6" class="panel"/><text x="40" y="261" class="muted">Event type ▾</text>
<rect x="208" y="236" width="172" height="40" rx="6" class="panel"/><text x="224" y="261" class="muted">Contract ▾</text>
<rect x="392" y="236" width="172" height="40" rx="6" class="panel"/><text x="408" y="261" class="muted">Date range ▾</text>
<rect x="576" y="236" width="168" height="40" rx="6" class="active"/><text x="592" y="261" class="label">More filters (3)</text>

<text x="24" y="312" class="kicker">RESULTS · 2-COLUMN CARD VIEW</text>

<rect x="24" y="330" width="348" height="170" rx="8" class="panel"/>
<text x="40" y="359" class="label">TRANSFER</text><text x="316" y="359" class="tiny">2s</text>
<text x="40" y="389" class="muted">Contract  CBA3…7KQ9</text><text x="40" y="415" class="muted">Ledger    12,456,981</text>
<text x="40" y="441" class="muted">Tx        8f2a…41ce</text><rect x="40" y="460" width="72" height="22" rx="11" class="active"/><text x="52" y="475" class="tiny">transfer</text>

<rect x="396" y="330" width="348" height="170" rx="8" class="panel"/>
<text x="412" y="359" class="label">CONTRACT</text><text x="688" y="359" class="tiny">8s</text>
<text x="412" y="389" class="muted">Contract  CDB9…2P1A</text><text x="412" y="415" class="muted">Ledger    12,456,980</text>
<text x="412" y="441" class="muted">Tx        a9be…8d10</text><rect x="412" y="460" width="68" height="22" rx="11" class="panel"/><text x="424" y="475" class="tiny">system</text>

<rect x="24" y="520" width="348" height="170" rx="8" class="panel"/>
<text x="40" y="549" class="label">DIAGNOSTIC</text><text x="316" y="549" class="tiny">14s</text>
<text x="40" y="579" class="muted">Contract  CAB1…0E3F</text><text x="40" y="605" class="muted">Ledger    12,456,979</text>
<text x="40" y="631" class="muted">Tx        c301…21aa</text><rect x="40" y="650" width="82" height="22" rx="11" class="panel"/><text x="52" y="665" class="tiny">diagnostic</text>

<rect x="396" y="520" width="348" height="170" rx="8" class="panel"/>
<text x="412" y="549" class="label">MINT</text><text x="688" y="549" class="tiny">21s</text>
<text x="412" y="579" class="muted">Contract  CD10…771B</text><text x="412" y="605" class="muted">Ledger    12,456,978</text>
<text x="412" y="631" class="muted">Tx        91de…8ac4</text><rect x="412" y="650" width="52" height="22" rx="11" class="active"/><text x="424" y="665" class="tiny">mint</text>

<rect x="24" y="716" width="720" height="56" rx="8" class="panel"/>
<text x="40" y="750" class="muted">Pagination / load more</text>
<text x="24" y="810" class="tiny">768 px · overlay app drawer · compact filter bar · 2-column cards</text>
<text x="24" y="832" class="tiny">Desktop table resumes at ≥1024 px in this design handoff.</text>

</svg>